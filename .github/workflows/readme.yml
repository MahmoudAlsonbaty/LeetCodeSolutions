name: Update README

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".github/readme/assets/**"
      - ".github/readme/cache.json"
  workflow_dispatch:
  schedule:
    # Daily, shortly after midnight Cairo time (21:17 UTC), so the activity
    # heatmap picks up LeetCode submissions even on days nothing is pushed.
    - cron: "17 21 * * *"

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so solve dates come from real commits

      - name: Generate README and cards
        run: python3 .github/readme/generate_readme.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/readme
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: update README stats"
            git push
          fi
